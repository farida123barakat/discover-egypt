# Local Supabase (`npx supabase start`, needs Docker) for development and CI.
# The hosted project is configured in the Supabase dashboard; see docs/DEPLOYMENT.md for the same settings.
project_id = "discover-egypt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local test mailbox: every auth email lands here (web UI on this port).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback**", "http://localhost:3200/auth/callback**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

# Generous limits locally so the test suite can send several emails; the hosted project keeps its own.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 300
token_verifications = 300
token_refresh = 300
