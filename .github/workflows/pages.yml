name: Live demo (GitHub Pages)

# Publishes the front-end-only site as plain files to https://<owner>.github.io/<repo>/.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions". (On a free GitHub plan,
# Pages needs the repository to be public.) Until then the build and tests still run here, and only
# the final publish step reports that Pages isn't switched on.
# Optional: Settings → Secrets and variables → Actions → Variables → CONTACT_EMAIL, the address
# the contact and community forms prepare their emails to.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the plain-files site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (scripts/build-pages.sh)
        run: bash scripts/build-pages.sh
      - run: npx playwright install --with-deps chromium
      - name: Test the built files the way Pages serves them
        run: npx playwright test -c playwright.pages.config.ts
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pages
          path: playwright-report-pages
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Reported, not fatal: the site is built and tested either way; this only fails while Pages is off.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
